name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build and package
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go build -trimpath \
            -ldflags="-s -w -X github.com/samma-io/alert-destination/internal/version.Version=${TAG}" \
            -o bin/bootstrap ./cmd/alert-destination
          mkdir -p dist
          (cd bin && zip -q -X "../dist/alert-destination-${TAG}.zip" bootstrap)
          (cd dist && sha256sum "alert-destination-${TAG}.zip" > "alert-destination-${TAG}.zip.sha256")
          cat "dist/alert-destination-${TAG}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/alert-destination-*.zip
            dist/alert-destination-*.zip.sha256
          generate_release_notes: true
