name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The image's default command already runs in-memory; the integration
      # tests use fixed static credentials, so a shared database is not needed.
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alertdest
          POSTGRES_PASSWORD: alertdest
          POSTGRES_DB: alertdest
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U alertdest" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8000 && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not answer on :8000"; exit 1
      - name: integration tests
        env:
          ALERTDEST_DYNAMODB_ENDPOINT_URL: http://127.0.0.1:8000
        run: go test -tags integration -count=1 ./integration/...
      - name: build (linux/amd64 bootstrap)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w' -o bin/bootstrap ./cmd/alert-destination

  # The image is built here and never pushed: images are built and pushed by
  # aws-siem/hack/build-images.sh. This proves the Dockerfile builds, that the
  # Lambda zip can be extracted from it, and that the image carries no
  # HIGH/CRITICAL finding with a fix available.
  image:
    name: image (build + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: make image IMAGE=alert-destination TAG=ci
      - name: extract the lambda zip
        run: |
          make lambda-zip IMAGE=alert-destination TAG=ci
          unzip -l dist/alert-destination.zip | grep -q ' bootstrap$'
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: alert-destination:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./hack/scrub-check.sh .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
